<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Penguin Rush 3D</title><style>
*{box-sizing:border-box}body{margin:0;background:#10172c;color:#fff;font-family:system-ui,Arial;overflow:hidden}
#ui{position:fixed;inset:0;pointer-events:none} .panel{pointer-events:auto;background:#17233beF;border:1px solid #49617e;border-radius:18px;padding:18px;box-shadow:0 12px 40px #0008}
#menu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,430px);text-align:center}
h1{margin:0 0 6px;color:#80eaff;font-size:clamp(30px,7vw,48px);text-shadow:0 4px #1b4965}p{color:#cbd9eb}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:0;font-size:16px}input{background:#eaf4ff;color:#132238}
button{background:#13b9d6;color:#042333;font-weight:800;cursor:pointer}button.alt{background:#f6b84a}button:disabled{opacity:.45}
#hud{display:none;position:absolute;top:12px;left:12px;right:12px;display:none;justify-content:space-between;gap:8px;align-items:flex-start}
.pill{background:#14223ddd;padding:10px 14px;border-radius:12px;font-weight:700}
#help{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#14223ddd;padding:9px 13px;border-radius:12px;text-align:center;font-size:13px}
#roster{position:absolute;right:12px;top:65px;max-width:180px;font-size:12px;background:#14223dcc;padding:9px;border-radius:12px}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:22px;font-weight:900;text-shadow:0 3px #000;text-align:center}
a{color:#8deaff}
</style></head><body>
<div id="ui">
 <div id="menu" class="panel">
  <h1>🐧 PENGUIN RUSH</h1><p>¡Corre, salta y esquiva la lava!</p>
  <input id="name" maxlength="16" placeholder="Tu nombre de pingüino">
  <button id="create">CREAR SALA</button>
  <input id="code" maxlength="6" placeholder="Código de sala">
  <button id="join" class="alt">UNIRME A UNA SALA</button>
  <div id="roomInfo"></div><button id="start" style="display:none">¡COMENZAR PARTIDA!</button>
  <p style="font-size:12px">Hasta 30 jugadores · WASD/flechas para moverte · ESPACIO para saltar</p>
  <div id="msg"></div>
 </div>
 <div id="hud"><div class="pill" id="round">Ronda 1/3</div><div class="pill" id="players">Jugadores: 1</div><div class="pill" id="status">En espera</div></div>
 <div id="roster"></div><div id="toast"></div>
 <div id="help">WASD / ← → para moverte · ESPACIO para saltar · Evita las bolas de lava</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/game.js"></script>
</body></html>
